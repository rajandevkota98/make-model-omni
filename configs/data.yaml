# Data pipeline: ingest → validate → transform → split → augment → format → speech_plan → report
# Run: uv run python -m pipelines.data [--stage NAME] [--force]

tools_config: configs/tools.yaml
augment_config: configs/augment.yaml
speech_config: configs/speech.yaml     # step 4: voices, clip counts, noise

paths:
  raw_dir: data/synthetic/raw        # Gemini JSONL drops (gitignored)
  artifacts_dir: data/artifacts      # one folder per stage: outputs + manifest.json
  splits_dir: data/splits            # train / dev / test
  augmented_dir: data/augmented      # multi-turn conversations per split
  formatted_dir: data/formatted      # token ids per assistant turn, ready for training
  reports_dir: data/reports

ingest:
  pattern: "*.jsonl"

validate:
  required_fields:
    id: string
    utterance: string
    category: string
    tool_calls: array
    reply: string
    needs_confirmation: boolean
  # allowed number of tool calls per category
  categories:
    single: {min_calls: 1, max_calls: 1}
    multi_step: {min_calls: 2, max_calls: 3}
    clarify: {min_calls: 0, max_calls: 0}
    no_tool: {min_calls: 0, max_calls: 0}
    refuse: {min_calls: 0, max_calls: 0}
    confirm: {min_calls: 1, max_calls: 1}
  reply_max_words:
    default: 12
    refuse: 25
    no_tool: 25
  # replies are spoken aloud: no URLs, JSON or code symbols
  reply_forbidden_pattern: "https?://|www\\.|\\.com\\b|[{}<>\\[\\]_|\\\\]"

transform:
  # argument values to Title Case, per tool
  title_case_args:
    get_weather: [location]

split:
  seed: 42
  test_size: 1000
  dev_size: 500
  stratify_on: [category, tool_focus]
  # test.jsonl is frozen once written; set true only to deliberately rebuild it
  refreeze_test: false

format:
  tokenizer: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca   # pinned so token ids never change silently
  max_length: 1536
  # JSON-schema keys left out of the prompt: validation-only, or said in words by the description
  hide_schema_keys: [if, then, else, additionalProperties, pattern, minLength]
  system_prompt: >-
    You are a voice assistant on a Linux desktop. Your replies are spoken aloud, so keep them short and
    natural, with no symbols or links. Use the tools to act. Ask before typing text or locking the screen.
