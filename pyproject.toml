[project]
name = "make-model-omni"
version = "0.1.0"
description = "Qwen3-0.6B → omni voice assistant (hears, sees, talks, acts), trained on Modal"
requires-python = ">=3.12"
dependencies = [
    "comet-ml>=3.58.8",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "modal>=1.6.1",
    "numpy>=2.5.4",
    "pyyaml>=6.0.3",
    "scipy>=1.18.1",
    "transformers>=5.19.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
